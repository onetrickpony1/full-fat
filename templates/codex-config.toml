# Full Fat: Codex settings for this folder (used once you trust the folder).
model = "gpt-6.2-astra"
model_reasoning_effort = "high"

[mcp_servers.jasp]
command = "uvx"
args = ["--with", "mcp<2", "--from", "git+https://github.com/jasp-stats/jasp-mcp@__JASP_MCP_REF__", "jasp-mcp"]
