name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: full-fat --help
      - run: full-fat --version

  # The one-line installers, run for real with a stand-in JASP settings file (no JASP installed), and with
  # git unusable as on a fresh Mac or Windows PC: setup starts JASP's connector once, so this proves that
  # jasp-mcp installs without git.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FULL_FAT_SOURCE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Desktop and gio for the launcher check (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/Desktop"
          command -v gio || { sudo apt-get update -q && sudo apt-get install -y -q libglib2.0-bin; }
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/nogit"
          printf '#!/bin/sh\necho "git is not installed (CI)" >&2\nexit 127\n' > "$RUNNER_TEMP/nogit/git"
          chmod +x "$RUNNER_TEMP/nogit/git"
          export PATH="$RUNNER_TEMP/nogit:$PATH"
          if git --version; then echo "git still works"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/jasp"
          printf '[General]\naiEnabled=false\n' > "$RUNNER_TEMP/jasp/JASP.conf"
          FULL_FAT_SETUP_ARGS="--yes --settings-file $RUNNER_TEMP/jasp/JASP.conf --jasp-version 0.99.0 --app both --no-install-apps --no-sign-in" sh install.sh
          grep -q '^rpcServerEnabled=true' "$RUNNER_TEMP/jasp/JASP.conf"
          test -f "$HOME/Full Fat/AGENTS.md"
          test -f "$HOME/Full Fat/.codex/config.toml"
          grep -F "[projects.'$HOME/Full Fat']" "$HOME/.codex/config.toml"
          # the command the README gives for opening the folder by hand
          bash -c 'cd "$HOME/Full Fat" && test -f .full-fat.json'
          if command -v zsh >/dev/null; then zsh -c 'cd "$HOME/Full Fat" && test -f .full-fat.json'; fi
          ls -la "$HOME/Desktop"
          if [ "$RUNNER_OS" = macOS ]; then
            icon="$HOME/Desktop/Full Fat.command"
            test -x "$icon"
            python3 tests/e2e_check_launcher.py "$icon" "$HOME/Full Fat" --fake-jasp
          else
            icon="$HOME/Desktop/Full Fat.desktop"
            grep -qx 'Name=Full Fat' "$icon"
            python3 tests/e2e_check_launcher.py "$icon" "$HOME/Full Fat" --fake-jasp --double-click
          fi
          "$HOME/.local/bin/full-fat" doctor || true
          "$HOME/.local/bin/full-fat" uninstall --yes
          if [ -e "$HOME/Full Fat" ] || [ -e "$icon" ]; then echo "uninstall left the folder or icon"; exit 1; fi
          if grep -F "Full Fat']" "$HOME/.codex/config.toml"; then echo "trust entry not removed"; exit 1; fi
          if grep -q '^rpcServerEnabled' "$RUNNER_TEMP/jasp/JASP.conf"; then echo "setting not restored"; exit 1; fi
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -and -not (Test-Path (Join-Path $_ "git.exe")) }) -join ";"
          if (Get-Command git -ErrorAction SilentlyContinue) { Write-Host "git still on PATH"; exit 1 }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\jasp" | Out-Null
          Set-Content -Path "$env:RUNNER_TEMP\jasp\JASP.ini" -Value "[General]`r`naiEnabled=false"
          $env:FULL_FAT_SETUP_ARGS = "--yes --settings-file $env:RUNNER_TEMP\jasp\JASP.ini --jasp-version 0.99.0 --app both --no-install-apps --no-sign-in"
          powershell -ExecutionPolicy ByPass -File install.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\jasp\JASP.ini" -Pattern '^rpcServerEnabled=true' -Quiet)) { exit 1 }
          if (-not (Test-Path "$env:USERPROFILE\Full Fat\AGENTS.md")) { exit 1 }
          $desk = [Environment]::GetFolderPath("Desktop")
          if (-not (Test-Path "$desk\Full Fat.cmd")) { exit 1 }
          Get-Content "$desk\Full Fat.cmd"
          if (-not (Select-String -Path "$env:USERPROFILE\.codex\config.toml" -SimpleMatch "Full Fat']" -Quiet)) { exit 1 }
          # the command the README gives for opening the folder by hand
          foreach ($shell in "powershell", "pwsh") {
            & $shell -NoProfile -Command 'cd "$HOME/Full Fat"; if (-not (Test-Path .full-fat.json)) { exit 1 }'
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          python tests/e2e_check_launcher.py "$desk\Full Fat.cmd" "$env:USERPROFILE\Full Fat" --fake-jasp
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:USERPROFILE\.local\bin\full-fat.exe" doctor
          & "$env:USERPROFILE\.local\bin\full-fat.exe" uninstall --yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Select-String -Path "$env:RUNNER_TEMP\jasp\JASP.ini" -Pattern '^rpcServerEnabled' -Quiet) { exit 1 }
          if (Test-Path "$env:USERPROFILE\Full Fat") { Write-Host "uninstall left the folder"; exit 1 }
          if (Test-Path "$desk\Full Fat.cmd") { Write-Host "uninstall left the icon"; exit 1 }
          if (Select-String -Path "$env:USERPROFILE\.codex\config.toml" -SimpleMatch "Full Fat']" -Quiet) { exit 1 }

  # The only real macOS check: install the real JASP, let Full Fat switch on its connection through
  # `defaults`, open JASP, and talk to it through jasp-mcp as the chat apps would.
  e2e-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      JASP_VERSION: "0.99.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the real JASP
        run: |
          arch="$(uname -m)"; [ "$arch" = arm64 ] || arch=x86_64
          curl -fL --retry 3 -o jasp.dmg "https://github.com/jasp-stats/jasp-desktop/releases/download/v$JASP_VERSION/JASP-$JASP_VERSION.0-MacOS-$arch.dmg"
          hdiutil attach -nobrowse -mountpoint /Volumes/JASP jasp.dmg
          cp -R /Volumes/JASP/JASP.app /Applications/
          hdiutil detach /Volumes/JASP
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" /Applications/JASP.app/Contents/Info.plist
      - run: python -m pip install -e .
      - name: Hide git, as on a fresh Mac
        run: |
          mkdir -p "$RUNNER_TEMP/nogit"
          printf '#!/bin/sh\necho "git is not installed (CI)" >&2\nexit 127\n' > "$RUNNER_TEMP/nogit/git"
          chmod +x "$RUNNER_TEMP/nogit/git"
          echo "$RUNNER_TEMP/nogit" >> "$GITHUB_PATH"
      - name: Full Fat setup (JASP closed, so it should switch the setting on)
        run: |
          full-fat setup --yes --app claude --no-install-apps --no-sign-in
          echo "rpcServerEnabled: $(defaults read org.jasp-stats.JASP rpcServerEnabled)"
          test "$(defaults read org.jasp-stats.JASP rpcServerEnabled)" = 1
          grep -c 'JASP-Stats\|Application Support/JASP' "$HOME/Full Fat/.claude/settings.json" || true
          cat "$HOME/Full Fat/.claude/settings.json"
      - name: Open JASP
        run: |
          # JASP's first start asks "Check for updates?" in a dialog that blocks before its connection starts
          # (Desktop/mainwindow.cpp v0.99.0 lines 197, 216, 224-244). A person answers it; CI pre-answers it.
          defaults write org.jasp-stats.JASP checkUpdatesAskUser -bool false
          open -a /Applications/JASP.app
      - name: Check JASP through jasp-mcp
        run: python tests/e2e_check_jasp.py "$HOME/Full Fat" --wait 900
      - name: Double-click the Full Fat icon
        timeout-minutes: 8
        run: python tests/e2e_check_launcher.py "$HOME/Desktop/Full Fat.command" "$HOME/Full Fat" --double-click
      - name: full-fat doctor
        if: always()
        run: full-fat doctor || true
      - name: What JASP wrote itself (proves the settings domain)
        if: always()
        run: |
          ls -la ~/Library/Preferences | grep -i jasp || true
          defaults read org.jasp-stats.JASP || true
          ps aux | grep -i '[J]ASP' | head || true
          ls -la ~/Library/Application\ Support/JASP/JASP 2>/dev/null || true
          screencapture -x screen.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-macos-screen
          path: screen.png
          if-no-files-found: ignore

  # The same on Windows with JASP's ZIP build (no installer needed). It keeps its settings in
  # %APPDATA%\JASP\JASP.ini, which only exists after JASP's first start, so the path is given.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      JASP_VERSION: "0.99.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the real JASP (ZIP)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/jasp-stats/jasp-desktop/releases/download/v$env:JASP_VERSION/JASP-$env:JASP_VERSION.0-Windows.zip" -OutFile jasp.zip
          Expand-Archive jasp.zip -DestinationPath "$env:RUNNER_TEMP\JASP"
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\JASP" -Filter JASPDesktop.exe | Select-Object -First 1 -ExpandProperty FullName
      - run: python -m pip install -e .
      - name: Full Fat setup
        shell: pwsh
        run: |
          full-fat setup --yes --app claude --no-install-apps --no-sign-in --settings-file "$env:APPDATA\JASP\JASP.ini" --jasp-version $env:JASP_VERSION
          Get-Content "$env:APPDATA\JASP\JASP.ini"
      - name: Open JASP
        shell: pwsh
        run: |
          # pre-answer JASP's first-start "Check for updates?" dialog, which blocks its connection
          Add-Content -Path "$env:APPDATA\JASP\JASP.ini" -Value "checkUpdatesAskUser=false"
          Get-Content "$env:APPDATA\JASP\JASP.ini"
          $exe = Get-ChildItem -Recurse "$env:RUNNER_TEMP\JASP" -Filter JASPDesktop.exe | Select-Object -First 1 -ExpandProperty FullName
          Start-Process $exe
      - name: Check JASP through jasp-mcp
        run: python tests/e2e_check_jasp.py "$env:USERPROFILE\Full Fat" --wait 900
        shell: pwsh
      - name: Double-click the Full Fat icon
        timeout-minutes: 8
        shell: pwsh
        run: |
          $desk = [Environment]::GetFolderPath("Desktop")
          python tests/e2e_check_launcher.py "$desk\Full Fat.cmd" "$env:USERPROFILE\Full Fat" --double-click
      - name: Diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -like "JASP*" } | Format-Table -AutoSize
          Get-Content "$env:APPDATA\JASP\JASP.ini" -ErrorAction SilentlyContinue
          Get-ChildItem "$env:LOCALAPPDATA\JASP\JASP" -ErrorAction SilentlyContinue
